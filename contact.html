<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact – WSG Finance</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <!-- HEADER -->
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">WSG Finance</a>

        <nav class="site-nav">
          <a href="diensten.html">Diensten</a>
          <a href="index.html#overons">Over ons</a>
          <a href="contact.html">Contact</a>
          <a href="en.html">EN</a>
        </nav>
      </div>
    </header>

    <main>

      <!-- CONTACT HERO -->
      <section class="hero">
        <div class="container hero-content">

          <div class="hero-text">
            <p class="eyebrow">Contact</p>
            <h1>Neem contact met ons op</h1>
            <p class="hero-copy">
              Vul het formulier in en wij nemen zo snel mogelijk contact met u op.
            </p>
          </div>

          <div class="hero-image">
            <div class="feature-card">
              <h2>Direct mailen?</h2>
              <p>Stuur uw vraag naar info@wsg-finance.com</p>
              <a href="mailto:info@wsg-finance.com" class="button primary" style="margin-top: 1rem;">
                Stuur e‑mail
              </a>
            </div>
          </div>

        </div>
      </section>

      <!-- CONTACT FORM -->
      <section class="section contact-section">
        <div class="container contact-card" style="flex-direction: column; align-items: stretch;">

          <h2 style="margin-bottom: 1rem;">Contactformulier</h2>

          <form action="mailto:info@wsg-finance.com" method="POST" enctype="text/plain" style="display: grid; gap: 1rem;">

            <label>
              Naam<br />
              <input type="text" name="Naam" required style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #e2e8f0;">
            </label>

            <label>
              E‑mail<br />
              <input type="email" name="Email" required style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #e2e8f0;">
            </label>

            <label>
              Bericht<br />
              <textarea name="Bericht" rows="5" required style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #e2e8f0;"></textarea>
            </label>

            <button type="submit" class="button primary" style="margin-top: 1rem; width: fit-content;">
              Verstuur bericht
            </button>

          </form>

        </div>
      </section>

    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© 2026 WSG Finance.</p>
      </div>
    </footer>

  </body>
</html>
