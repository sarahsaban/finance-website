<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact – WSG Finance</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <!-- HEADER -->
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">WSG Finance</a>

        <nav class="site-nav">
          <a href="diensten.html">Diensten</a>
          <a href="index.html#overons">Over ons</a>
          <a href="contact.html">Contact</a>
           <a href="encontact.html">
  <img src="images/uk-flag.svg" alt="English" style="height: 20px;">
</a>
        </nav>
      </div>
    </header>

    <main>

      <!-- CONTACT HERO -->
      <section class="hero">
        <div class="container hero-content">

          <div class="hero-text">
            <p class="eyebrow">Contact</p>
            <h1>Neem contact met ons op</h1>
            <p class="hero-copy">
              Vul het formulier in en wij nemen zo snel mogelijk contact met u op.
            </p>
          </div>

          <div class="hero-image">
            <div class="feature-card">
              <h2>Direct mailen?</h2>
              <p>Stuur uw vraag naar info@wsg-finance.com</p>
              <a href="mailto:info@wsg-finance.com" class="button primary" style="margin-top: 1rem;">
                Stuur e‑mail
              </a>
            </div>
          </div>

        </div>
      </section>

      <!-- CONTACT FORM -->
      <section class="section contact-section">
        <div class="container contact-card" style="flex-direction: column; align-items: stretch;">

          <h2 style="margin-bottom: 1rem;">Contactformulier</h2>

          <form
            action="https://formspree.io/f/xkoawgpo"
            method="POST"
            class="contact-form"
            style="display: grid; gap: 1rem;"
          >
            <!-- Honeypot (anti-spam) -->
            <input type="text" name="_gotcha" style="display:none" />

            <label>
              Naam<br />
              <input
                type="text"
                name="name"
                required
                minlength="2"
                style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #e2e8f0;"
              />
            </label>

            <label>
              E‑mail<br />
              <input
                type="email"
                name="email"
                required
                style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #e2e8f0;"
              />
            </label>

            <label>
              Bericht<br />
              <textarea
                name="message"
                rows="5"
                required
                minlength="10"
                style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #e2e8f0;"
              ></textarea>
            </label>

            <button
              type="submit"
              class="button primary"
              style="margin-top: 1rem; width: fit-content;"
            >
              Verstuur bericht
            </button>
          </form>

          <p id="success-message" style="display:none; color:green; margin-top:1rem;">
            Bedankt! Uw bericht is verzonden.
          </p>

        </div>
      </section>

    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© 2026 WSG Finance.</p>
      </div>
    </footer>

    <script>
      const form = document.querySelector(".contact-form");
      const success = document.getElementById("success-message");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = new FormData(form);

        const response = await fetch(form.action, {
          method: "POST",
          body: data,
          headers: { Accept: "application/json" },
        });

        if (response.ok) {
          form.reset();
          success.style.display = "block";
        }
      });
    </script>
  </body>
</html>
