<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact – WSG Finance</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <!-- HEADER -->
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">WSG Finance</a>

        <nav class="site-nav">
          <a href="endiensten.html">Services</a>
          <a href="en.html#about">About</a>
          <a href="enontact.html">Contact</a>
          <a href="index.html">
  <img src="images/nl-flag.svg" alt="Nederlands" style="height: 20px;">
</a>
        </nav>
      </div>
    </header>

    <main>

      <!-- CONTACT HERO -->
      <section class="hero">
        <div class="container hero-content">

          <div class="hero-text">
            <p class="eyebrow">Contact</p>
            <h1>Get in Touch With Us</h1>
            <p class="hero-copy">
              Fill in the form below and we will get back to you as soon as possible.
            </p>
          </div>

          <div class="hero-image">
            <div class="feature-card">
              <h2>Email Directly</h2>
              <p>Prefer to use your own email client?</p>
              <a href="mailto:info@wsg-finance.com" class="button primary" style="margin-top: 1rem;">
                Send Email
              </a>
            </div>
          </div>

        </div>
      </section>

      <!-- CONTACT FORM -->
      <section class="section contact-section">
        <div class="container contact-card" style="flex-direction: column; align-items: stretch;">

          <h2 style="margin-bottom: 1rem;">Contact Form</h2>

          <form action="mailto:info@wsg-finance.com" method="POST" enctype="text/plain" style="display: grid; gap: 1rem;">

            <label>
              Name<br />
              <input type="text" name="Name" required style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #e2e8f0;">
            </label>

            <label>
              Email<br />
              <input type="email" name="Email" required style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #e2e8f0;">
            </label>

            <label>
              Message<br />
              <textarea name="Message" rows="5" required style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #e2e8f0;"></textarea>
            </label>

            <button type="submit" class="button primary" style="margin-top: 1rem; width: fit-content;">
              Send Message
            </button>

          </form>

        </div>
      </section>

    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© 2026 WSG Finance.</p>
      </div>
    </footer>

  </body>
</html>
